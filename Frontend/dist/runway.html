<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>"RUNWAY" – Studio</title>
    <script type="module" crossorigin src="/assets/runway-DY07W8r5.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/assets/board-store-To4_ItAX.js">
    <link rel="modulepreload" crossorigin href="/assets/music-BTDoccEr.js">
    <link rel="modulepreload" crossorigin href="/assets/cart-Eg9_IFkV.js">
    <link rel="stylesheet" crossorigin href="/assets/board-store-kpIW8ZQu.css">
    <link rel="stylesheet" crossorigin href="/assets/music-BVoPGAcx.css">
  </head>
  <body class="rw">
    <header class="rw-top">
      <a class="rw-back" href="./">← "STUDIO"</a>
      <span>RUNWAY ARCHIVE</span>
      <span class="rw-top-end">C/O VOGUE RUNWAY</span>
    </header>

    <main>
      <section class="rw-hero">
        <h1>"RUNWAY"</h1>
        <p>FOR VIEWING PURPOSES ONLY</p>
      </section>

      <form class="rw-menu" aria-label="Choose a show" onsubmit="return false">
        <label>
          <span>01 / BRAND</span>
          <div class="rw-search">
            <input
              id="runway-designer"
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="runway-brands"
              autocomplete="off"
              spellcheck="false"
              placeholder="SEARCH BRANDS"
            />
            <ul id="runway-brands" class="rw-brands" role="listbox" aria-label="Brands" hidden></ul>
          </div>
        </label>
        <label>
          <span>02 / LINE</span>
          <select id="runway-line">
            <option value="ALL">ALL</option>
            <option value="MENSWEAR">MENSWEAR</option>
            <option value="WOMENSWEAR">WOMENSWEAR</option>
          </select>
        </label>
        <label>
          <span>03 / YEAR</span>
          <select id="runway-year"></select>
        </label>
        <label>
          <span>04 / SHOW</span>
          <select id="runway-show"></select>
        </label>
      </form>

      <section class="rw-show" aria-labelledby="rw-designer">
        <div class="rw-show-head">
          <h2 id="rw-designer" class="rw-designer"></h2>
          <p class="rw-details">
            <span class="rw-season"></span>
            <span class="rw-count"></span>
          </p>
        </div>
        <p class="rw-status" aria-live="polite"></p>
        <div class="rw-grid"></div>
      </section>
    </main>

    <dialog class="art-view" aria-labelledby="rw-view-title">
      <div class="art-view-bar">
        <span class="art-view-index"></span>
        <button class="art-view-close" type="button" aria-label="Close">CLOSE ×</button>
      </div>
      <div class="art-view-frame">
        <img alt="" referrerpolicy="no-referrer" />
      </div>
      <div class="art-view-caption">
        <h3 id="rw-view-title"></h3>
        <p class="art-view-meta"></p>
        <div class="rw-view-actions">
          <button class="rw-find" type="button">FIND PIECES ◎</button>
          <a class="art-view-link" target="_blank" rel="noopener">VIEW ON VOGUE RUNWAY ↗</a>
        </div>
      </div>
      <aside class="rw-lookalikes" aria-label="The chosen piece" aria-live="polite"></aside>
    </dialog>

    <footer class="rw-foot">
      <span>"PICTURES"</span>
      <span>C/O VOGUE RUNWAY</span>
      <span>STUDIO</span>
    </footer>

  </body>
</html>
